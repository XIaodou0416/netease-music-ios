name: TodoDemo

options:
  deploymentTarget:
    iOS: "16.0"

targets:
  TodoDemo:
    type: application
    platform: iOS
    sources: [TodoDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tododemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 待办清单
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  TodoDemo:
    build:
      targets:
        TodoDemo: all
    run:
      config: Debug
    archive:
      config: Release